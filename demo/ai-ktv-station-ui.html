.form-check {

.form-check-input {

  height: 14px;

  color: var(--primary-foreground);

  transition:

  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {

.form-check:not(.form-switch)

  cursor: not-allowed;
  pointer-events: none;

.form-switch .form-check-input:disabled,

.form-range::-moz-range-track {

.form-range:focus-visible::-moz-range-thumb {

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;ktv-station-demo&#x27;);
      const viewButtons = root.querySelectorAll(&#x27;[data-view]&#x27;);
      const panels = root.querySelectorAll(&#x27;[data-panel]&#x27;);
      viewButtons.forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
        viewButtons.forEach(item =&gt; item.setAttribute(&#x27;aria-pressed&#x27;, String(item === button)));
        panels.forEach(panel =&gt; { panel.style.display = panel.dataset.panel === button.dataset.view ? (button.dataset.view === &#x27;mobile&#x27; ? &#x27;flex&#x27; : &#x27;grid&#x27;) : &#x27;none&#x27;; });
      }));

      const playButton = root.querySelector(&#x27;[data-play]&#x27;);
      let playing = true;
      playButton.addEventListener(&#x27;click&#x27;, () =&gt; {
        playing = !playing;
        playButton.querySelector(&#x27;span&#x27;).textContent = playing ? &#x27;暂停&#x27; : &#x27;播放&#x27;;
        playButton.querySelector(&#x27;i&#x27;).setAttribute(&#x27;data-lucide&#x27;, playing ? &#x27;pause&#x27; : &#x27;play&#x27;);
        if (globalThis.lucide) lucide.createIcons({ attrs: { width: 16, height: 16 } });
      });

      root.querySelectorAll(&#x27;[data-track]&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
        root.querySelectorAll(&#x27;[data-track]&#x27;).forEach(item =&gt; item.setAttribute(&#x27;aria-pressed&#x27;, String(item === button)));
      }));
      root.querySelector(&#x27;[data-volume]&#x27;).addEventListener(&#x27;input&#x27;, event =&gt; { root.querySelector(&#x27;[data-volume-label]&#x27;).textContent = `${event.target.value}%`; });
      root.querySelector(&#x27;.ktv-progress&#x27;).addEventListener(&#x27;input&#x27;, event =&gt; {
        const seconds = Number(event.target.value);
        root.querySelector(&#x27;[data-current-time]&#x27;).textContent = `${String(Math.floor(seconds / 60)).padStart(2, &#x27;0&#x27;)}:${String(seconds % 60).padStart(2, &#x27;0&#x27;)}`;
      });

      const queue = root.querySelector(&#x27;[data-queue]&#x27;);
      const updateQueue = () =&gt; {
        [...queue.children].forEach((item, index) =&gt; { item.querySelector(&#x27;.ktv-index&#x27;).textContent = String(index + 1); });
        root.querySelector(&#x27;[data-queue-count]&#x27;).textContent = String(queue.children.length);
      };
      queue.addEventListener(&#x27;click&#x27;, event =&gt; {
        const row = event.target.closest(&#x27;li&#x27;);
        if (!row) return;
        if (event.target.closest(&#x27;[data-remove]&#x27;)) row.remove();
        if (event.target.closest(&#x27;[data-top]&#x27;)) queue.prepend(row);
        updateQueue();
      });

      const results = [...root.querySelectorAll(&#x27;[data-song]&#x27;)];
      root.querySelector(&#x27;[data-search]&#x27;).addEventListener(&#x27;input&#x27;, event =&gt; {
        const term = event.target.value.trim().toLowerCase();
        let visible = 0;
        results.forEach(row =&gt; { const match = row.dataset.song.toLowerCase().includes(term); row.hidden = !match; if (match) visible += 1; });
        root.querySelector(&#x27;[data-live]&#x27;).textContent = `找到 ${visible} 首歌曲`;
      });
      root.querySelector(&#x27;[data-results]&#x27;).addEventListener(&#x27;click&#x27;, event =&gt; {
        const button = event.target.closest(&#x27;.ktv-add&#x27;);
        if (!button || button.classList.contains(&#x27;ktv-added&#x27;)) return;
        button.classList.add(&#x27;ktv-added&#x27;);
        button.textContent = &#x27;✓&#x27;;
        button.setAttribute(&#x27;aria-label&#x27;, &#x27;已点播&#x27;);
        const count = root.querySelector(&#x27;[data-mobile-count]&#x27;);
        count.textContent = String(Number(count.textContent) + 1);
        root.querySelector(&#x27;[data-live]&#x27;).textContent = &#x27;已加入点歌队列&#x27;;
      });

      const design = { radius: 18, accent: &#x27;#7c3aed&#x27;, compact: false };
      const renderDesign = () =&gt; {
        root.style.setProperty(&#x27;--ktv-radius&#x27;, `${design.radius}px`);
        root.style.setProperty(&#x27;--ktv-accent&#x27;, design.accent);
        root.style.setProperty(&#x27;--ktv-density&#x27;, design.compact ? &#x27;compact&#x27; : &#x27;comfortable&#x27;);
      };
      renderDesign();
      if (globalThis.Tweak) {
        const tweak = new Tweak({ container: root.querySelector(&#x27;.ktv-shell&#x27;), onChange: renderDesign });
        tweak.addColorPicker(design, &#x27;accent&#x27;, { label: &#x27;品牌强调色&#x27;, reference: &#x27;--ktv-accent&#x27; });
        tweak.addSlider(design, &#x27;radius&#x27;, { label: &#x27;面板圆角&#x27;, min: 6, max: 26, unit: &#x27;px&#x27;, reference: &#x27;--ktv-radius&#x27; });
      }
    })();
  &lt;/script&gt;
